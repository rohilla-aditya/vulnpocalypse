name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  # Scrapes the real upstreams and prints one OK/FAILED line per source and
  # every feed that is down. Informational: other people's servers being flaky
  # must not block a merge, so only "nothing scraped at all" fails the job.
  live-scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Scrape every source for real
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VULN_CACHE_FILE: ${{ runner.temp }}/feed-cache.json
        run: python -m app.build "$RUNNER_TEMP/dist"
