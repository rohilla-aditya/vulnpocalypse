# Publishes the dashboard to GitHub Pages and rescrapes it every hour.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: pages

on:
  schedule:
    # GitHub starts scheduled workflows late and silently drops many of them, so
    # one slot per hour gave a scrape every 4-9 hours. Four slots an hour, with
    # the freshness check below skipping any that land within 50 minutes of the
    # last scrape, keeps the real cadence close to hourly.
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - id: pages
        uses: actions/configure-pages@v5
      # Last good scrape, so a source that is down this hour keeps its rows.
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: vuln-pocalypse-feed-${{ github.run_id }}
          restore-keys: vuln-pocalypse-feed-
      - id: fresh
        name: Skip scheduled runs that follow a recent scrape
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, time
          try:
              age = time.time() - json.load(open(".cache/feed.json"))["generated_at"]
          except Exception:
              age = 1e9
          print("skip=true" if age < 50 * 60 else "skip=false")
          PY
      - name: Scrape and build
        if: steps.fresh.outputs.skip != 'true'
        env:
          PUBLIC_URL: ${{ steps.pages.outputs.base_url }}
          VULN_CACHE_FILE: .cache/feed.json
          GITHUB_TOKEN: ${{ github.token }}   # raises the GitHub Advisories rate limit
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}   # optional
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}   # optional repo variable; enables SEC 8-K filings
        run: |
          mkdir -p .cache
          python -m app.build dist
      - uses: actions/cache/save@v4
        if: steps.fresh.outputs.skip != 'true'
        with:
          path: .cache
          key: vuln-pocalypse-feed-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        if: steps.fresh.outputs.skip != 'true'
        with:
          path: dist
      - id: deploy
        if: steps.fresh.outputs.skip != 'true'
        uses: actions/deploy-pages@v4
